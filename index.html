<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>손 위의 새 카메라</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #fff;
    color: #111;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #canvas {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  #video { display: none; }
  #status {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 13px 16px;
    text-align: center;
    color: #111;
    font-size: 14px;
    background: rgba(255,255,255,0.92);
    border-bottom: 1px solid #111;
    z-index: 10;
    transition: opacity 0.4s;
  }
  #status.hidden { opacity: 0; pointer-events: none; }
  #controls {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    display: none; justify-content: center; gap: 10px;
    z-index: 10;
  }
  button {
    appearance: none;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: 1px solid #111;
    border-radius: 0;
    background: #fff;
    color: #111;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
  #recordBtn.recording { background: #e5484d; border-color: #e5484d; color: #fff; }

  /* ---- 시작 전 손그림 등록 화면 ---- */
  #setup {
    position: fixed; inset: 0;
    z-index: 20;
    background: #fff;
    color: #111;
    overflow-y: auto;
    padding: 56px 24px calc(48px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  #setup > * { width: 100%; max-width: 480px; }
  #setup h1 {
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1.04;
  }
  #setup p {
    font-size: 14px; color: #555; line-height: 1.7;
    margin: 4px 0 10px;
  }
  .secLabel {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    margin-top: 6px;
  }
  .secLabel::after { content: ""; flex: 1; border-top: 1px solid #111; }
  #pairList { display: flex; flex-direction: column; gap: 8px; }
  #pairList:empty::after {
    content: "아직 등록된 그림이 없어요";
    font-size: 13px; color: #aaa; padding: 10px 0;
  }
  .pair {
    display: flex; align-items: center; gap: 12px;
    background: #fff;
    border: 1px solid #111;
    padding: 10px 12px;
  }
  .pair img, .pair canvas {
    width: 52px; height: 52px;
    object-fit: contain;
    background: #f5f5f5;
  }
  .pair select {
    flex: 1;
    font-size: 15px;
    padding: 10px;
    border: 1px solid #111;
    border-radius: 0;
    background: #fff;
    color: #111;
  }
  .pair .del { border: none; padding: 8px 10px; font-size: 15px; }
  #addBtn, #drawBtn { border-style: dashed; }
  #startBtn {
    background: #111; color: #fff;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.12em;
    padding: 16px 20px;
    margin-top: 8px;
  }
  #setupHint { font-size: 12px; color: #aaa; text-align: center; }
  #feedbackBtn {
    border: none;
    background: none;
    color: #aaa;
    font-size: 13px;
    text-decoration: underline;
    padding: 4px;
    width: auto;
  }
  #inappWarn {
    border: 1px solid #e5484d;
    color: #e5484d;
    padding: 14px;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
  }
  #inappWarn button {
    margin-top: 10px;
    border-color: #e5484d;
    color: #e5484d;
    font-weight: 700;
  }
  #defaultRow { display: flex; gap: 8px; }
  .defItem {
    flex: 1;
    border: 1px solid #111;
    padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .defItem canvas { width: 92px; height: 92px; }
  .defItem span { font-size: 12px; color: #555; }

  #fbText {
    width: min(90vw, 480px);
    border: 1px solid #111;
    border-radius: 0;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  #fbSend { background: #111; color: #fff; }

  /* ---- 그림판/눈 위치 모달 ---- */
  #drawModal, #eyeModal, #fbModal {
    position: fixed; inset: 0;
    z-index: 30;
    background: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  #drawModal.open, #eyeModal.open, #fbModal.open { display: flex; }
  #eyeCanvas {
    max-width: min(90vw, 480px);
    max-height: 62vh;
    border: 1px solid #111;
    background: repeating-conic-gradient(#f2f2f2 0 25%, #fff 0 50%) 0 0 / 24px 24px;
    touch-action: none;
  }
  .eyeHint { font-size: 13px; color: #555; }
  #eyeDone { background: #111; color: #fff; }
  #drawCanvas {
    width: min(90vw, 62vh, 480px);
    height: min(90vw, 62vh, 480px);
    border: 1px solid #111;
    /* 체커보드는 CSS 배경이라 저장되는 PNG는 투명 유지 */
    background: repeating-conic-gradient(#f2f2f2 0 25%, #fff 0 50%) 0 0 / 24px 24px;
    touch-action: none;
  }
  #drawTools, #brushRow, #drawActions, #eyeActions, #fbActions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: min(92vw, 540px);
  }
  #colorPick {
    width: 40px; height: 34px;
    border: 1px solid #111; border-radius: 0;
    padding: 0; background: none; cursor: pointer;
  }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid #e5e5e5;
    padding: 0;
  }
  .swatch.sel { border-color: #111; transform: scale(1.15); }
  .tool { padding: 8px 12px; font-size: 13px; }
  .tool.sel { background: #111; color: #fff; }
  #sizeRange { width: 110px; accent-color: #111; }
  #drawDone { background: #111; color: #fff; }
  #drawCancel { color: #777; border-color: #ccc; }
</style>
</head>
<body>
<!-- 시작 화면: 손그림 + 부위 페어 등록 -->
<div id="setup">
  <div id="inappWarn" hidden>
    카카오톡·인스타 등 앱 안의 브라우저에서는 손 인식이 잘 안 돼요.<br>
    <button id="openExternal">Chrome / 기본 브라우저로 열기</button>
  </div>
  <h1>Birds on<br>My Hands</h1>
  <p>손그림을 등록하고 어느 부위에 붙일지 고르세요.<br>
     등록 없이 시작하면 기본 그림(손바닥=새, 정수리=계란 후라이)이 나와요.<br>
     배경이 투명한 PNG를 쓰면 제일 예뻐요.</p>
  <div class="secLabel">등록된 그림</div>
  <div id="pairList"></div>
  <button id="addBtn">＋ 손그림 추가 (사진)</button>
  <button id="drawBtn">✏️ 직접 그리기</button>
  <div class="secLabel">기본 그림</div>
  <div id="defaultRow">
    <div class="defItem"><canvas id="defBird" width="140" height="140"></canvas><span>손바닥 · 새</span></div>
    <div class="defItem"><canvas id="defEgg" width="140" height="140"></canvas><span>정수리 · 계란 후라이</span></div>
  </div>
  <button id="startBtn">카메라 시작</button>
  <div id="setupHint">같은 부위에 여러 장 등록하면 손마다 번갈아 나와요 · 👁 버튼으로 눈 위치를 지정하면 깜빡여요</div>
  <button id="feedbackBtn">💬 피드백 보내기</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>

<!-- 그림판 모달 -->
<div id="drawModal">
  <div id="drawTools">
    <input type="color" id="colorPick" value="#1a1712" title="색 직접 고르기">
  </div>
  <div id="brushRow">
    <button class="tool brush sel" data-brush="pen">펜</button>
    <button class="tool brush" data-brush="marker">마커</button>
    <button class="tool brush" data-brush="highlight">형광펜</button>
    <button class="tool brush" data-brush="crayon">크레용</button>
    <button class="tool brush" data-brush="spray">스프레이</button>
    <button class="tool" id="eraserBtn">지우개</button>
    <input type="range" id="sizeRange" min="4" max="48" value="14">
    <button class="tool" id="undoBtn">↩</button>
    <button class="tool" id="clearBtn">전체 지우기</button>
  </div>
  <canvas id="drawCanvas" width="640" height="640"></canvas>
  <div id="drawActions">
    <button id="drawCancel">취소</button>
    <button id="drawDone">완료 → 등록</button>
  </div>
</div>

<!-- 피드백 모달 -->
<div id="fbModal">
  <div class="eyeHint">버그 제보, 아이디어, 감상 뭐든 환영해요!</div>
  <textarea id="fbText" rows="6" placeholder="예: 갤럭시 크롬에서 새가 안 나와요 / 강아지 스티커도 있으면 좋겠어요"></textarea>
  <div id="fbActions">
    <button id="fbCancel">취소</button>
    <button id="fbSend">보내기</button>
  </div>
</div>

<!-- 눈 위치 지정 모달 -->
<div id="eyeModal">
  <div class="eyeHint">눈이 있는 곳을 탭하세요 · 다시 탭하면 제거돼요</div>
  <canvas id="eyeCanvas" width="480" height="480"></canvas>
  <div id="eyeActions">
    <button id="eyeClear">전체 지우기</button>
    <button id="eyeDone">완료</button>
  </div>
</div>

<div id="stage"><canvas id="canvas"></canvas></div>
<video id="video" playsinline muted autoplay></video>
<div id="status" class="hidden"></div>
<div id="controls">
  <button id="backBtn">← 처음으로</button>
  <button id="photoBtn">📸 사진</button>
  <button id="recordBtn">● 녹화</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker, FaceDetector } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const MAX_HANDS = 4;
const MAX_HEADS = 4;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const recordBtn = document.getElementById("recordBtn");
const setupEl = document.getElementById("setup");
const pairListEl = document.getElementById("pairList");
const addBtn = document.getElementById("addBtn");
const startBtn = document.getElementById("startBtn");
const fileInput = document.getElementById("fileInput");

function setStatus(msg, hide = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("hidden", hide);
}

// 기기별 문제 진단용: 잡히지 않은 오류를 화면에 표시
window.addEventListener("error", (e) => setStatus("오류: " + (e.message || e.type)));
window.addEventListener("unhandledrejection", (e) => setStatus("오류: " + (e.reason?.message || e.reason)));

// ---- 인앱 브라우저(카톡/인스타 등) 감지: 손 인식이 안 되므로 외부 브라우저 안내 ----
const UA = navigator.userAgent;
const isKakao = /KAKAOTALK/i.test(UA);
const isInApp = isKakao || /Instagram|FBAN|FBAV|Line\/|NAVER\(inapp/i.test(UA);
if (isInApp) {
  document.getElementById("inappWarn").hidden = false;
  document.getElementById("openExternal").addEventListener("click", () => {
    if (isKakao) {
      // 카톡 전용: 외부 브라우저로 여는 스킴
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    } else if (/Android/i.test(UA)) {
      location.href =
        "intent://" + location.host + location.pathname +
        "#Intent;scheme=https;package=com.android.chrome;end";
    } else {
      // iOS 기타 인앱: 자동으로 못 열어서 주소 복사 안내
      navigator.clipboard?.writeText(location.href);
      alert("주소를 복사했어요. Safari에 붙여넣어 열어주세요!");
    }
  });
}

// ---- 손그림 + 부위 페어 등록 ----
// pairs: [{ img: HTMLImageElement, part: 'palm' | 'head' }]
const pairs = [];

function addPair(img) {
  const pair = { img, part: "palm", eyes: [] };
  pairs.push(pair);

  const row = document.createElement("div");
  row.className = "pair";
  // 썸네일도 카메라에서처럼 움직이게 캔버스로 그림 (previewLoop에서 애니메이션)
  const thumb = document.createElement("canvas");
  thumb.width = 104;
  thumb.height = 104;
  pair.thumbCtx = thumb.getContext("2d");
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="palm">손바닥 위</option><option value="head">정수리 위</option>
    <option value="eye">눈 위 (양쪽)</option><option value="nose">코 위</option><option value="mouth">입 위</option>
    <option value="cheek">볼 위 (양쪽)</option><option value="ear">귀 위 (양쪽)</option>`;
  sel.addEventListener("change", () => (pair.part = sel.value));
  const eyeBtn = document.createElement("button");
  eyeBtn.className = "del";
  eyeBtn.textContent = "👁";
  eyeBtn.title = "눈 위치 지정 (깜빡임)";
  eyeBtn.addEventListener("click", () => openEyeModal(pair));
  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "✕";
  del.addEventListener("click", () => {
    pairs.splice(pairs.indexOf(pair), 1);
    row.remove();
  });
  row.append(thumb, sel, eyeBtn, del);
  pairListEl.appendChild(row);
}

// ---- 눈 위치 지정: 탭한 자리를 깜빡임 때 감은 눈으로 덮음 ----
const eyeModal = document.getElementById("eyeModal");
const eyeCanvas = document.getElementById("eyeCanvas");
const eyeCtx = eyeCanvas.getContext("2d");
let eyePair = null;

function openEyeModal(pair) {
  eyePair = pair;
  const img = pair.img;
  if (!img.complete || !img.naturalWidth) return;
  const maxS = 480;
  const ar = img.naturalWidth / img.naturalHeight;
  eyeCanvas.width = ar >= 1 ? maxS : Math.round(maxS * ar);
  eyeCanvas.height = ar >= 1 ? Math.round(maxS / ar) : maxS;
  renderEyeCanvas();
  eyeModal.classList.add("open");
}

function renderEyeCanvas() {
  const w = eyeCanvas.width, h = eyeCanvas.height;
  eyeCtx.clearRect(0, 0, w, h);
  eyeCtx.drawImage(eyePair.img, 0, 0, w, h);
  const R = 0.09 * Math.max(w, h);
  for (const eye of eyePair.eyes) {
    eyeCtx.beginPath();
    eyeCtx.arc(eye.x * w, eye.y * h, R, 0, Math.PI * 2);
    eyeCtx.strokeStyle = "#e5484d";
    eyeCtx.lineWidth = 3;
    eyeCtx.stroke();
  }
}

eyeCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const r = eyeCanvas.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  const near = eyePair.eyes.findIndex((eye) => Math.hypot(eye.x - nx, eye.y - ny) < 0.09);
  if (near >= 0) eyePair.eyes.splice(near, 1);
  else eyePair.eyes.push({ x: nx, y: ny });
  renderEyeCanvas();
});
document.getElementById("eyeClear").addEventListener("click", () => {
  eyePair.eyes.length = 0;
  renderEyeCanvas();
});
document.getElementById("eyeDone").addEventListener("click", () => {
  sampleEyeColors(eyePair);
  eyeModal.classList.remove("open");
});

// 눈 주변 색을 샘플링해서 감은 눈 덮개 색으로 사용.
// 평균을 쓰면 외곽선(검정)과 바탕이 섞여 눈마다 색이 달라지므로,
// 모든 눈 주변 샘플을 합쳐 최빈색(가장 많이 나오는 색)을 뽑아 두 눈에 똑같이 적용
function sampleEyeColors(pair) {
  const img = pair.img;
  if (pair.eyes.length === 0) return;
  const S = 256;
  const ar = img.naturalWidth / img.naturalHeight;
  const w = ar >= 1 ? S : Math.round(S * ar);
  const h = ar >= 1 ? Math.round(S / ar) : S;
  const cnv = document.createElement("canvas");
  cnv.width = w; cnv.height = h;
  const cc = cnv.getContext("2d");
  cc.drawImage(img, 0, 0, w, h);
  const data = cc.getImageData(0, 0, w, h).data;

  const R = 0.09 * Math.max(w, h);
  const buckets = new Map(); // 양자화한 색 → { count, r, g, b }
  for (const eye of pair.eyes) {
    const ex = eye.x * w, ey = eye.y * h;
    for (const mul of [1.25, 1.6, 2.0]) {
      for (let a = 0; a < 24; a++) {
        const ang = (a / 24) * Math.PI * 2;
        const px = Math.round(ex + Math.cos(ang) * R * mul);
        const py = Math.round(ey + Math.sin(ang) * R * mul);
        if (px < 0 || py < 0 || px >= w || py >= h) continue;
        const o = (py * w + px) * 4;
        if (data[o + 3] < 40) continue;
        const key = `${data[o] >> 5},${data[o + 1] >> 5},${data[o + 2] >> 5}`;
        const bk = buckets.get(key) || { count: 0, r: 0, g: 0, b: 0 };
        bk.count++; bk.r += data[o]; bk.g += data[o + 1]; bk.b += data[o + 2];
        buckets.set(key, bk);
      }
    }
  }
  let best = null;
  for (const bk of buckets.values()) {
    if (!best || bk.count > best.count) best = bk;
  }
  const color = best
    ? `rgb(${Math.round(best.r / best.count)},${Math.round(best.g / best.count)},${Math.round(best.b / best.count)})`
    : "#fdf8e4";
  for (const eye of pair.eyes) eye.color = color;
}

// 감은 눈 그리기: 주변 색으로 덮고 가로선. (dx, dy)는 이미지 좌상단 좌표
function drawEyesBlink(c, pair, dx, dy, w, h) {
  const R = 0.09 * Math.max(w, h);
  for (const eye of pair.eyes || []) {
    const ex = dx + eye.x * w;
    const ey = dy + eye.y * h;
    c.beginPath();
    c.arc(ex, ey, R, 0, Math.PI * 2);
    c.fillStyle = eye.color || "#fdf8e4";
    c.fill();
    c.strokeStyle = "#1a1712";
    c.lineWidth = Math.max(2, R * 0.28);
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(ex - R * 0.75, ey);
    c.lineTo(ex + R * 0.75, ey);
    c.stroke();
  }
}

addBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  for (const file of fileInput.files) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    addPair(img);
  }
  fileInput.value = "";
});

// ---- 그림판: 투명 배경 캔버스에 직접 그려서 등록 ----
const drawModal = document.getElementById("drawModal");
const drawCanvas = document.getElementById("drawCanvas");
const dctx = drawCanvas.getContext("2d");
const drawTools = document.getElementById("drawTools");
const sizeRange = document.getElementById("sizeRange");
const eraserBtn = document.getElementById("eraserBtn");

const colorPick = document.getElementById("colorPick");
const COLORS = [
  "#1a1712", "#6b6455", "#ffffff", "#fdf8e4",
  "#e5484d", "#ff8fa3", "#f5921e", "#f7b733",
  "#4caf6e", "#a3d977", "#3b82d6", "#7cc4e8",
  "#8b5ad6", "#c98be8", "#8b5a3c", "#d9a066",
];
let penColor = COLORS[0];
let erasing = false;

COLORS.slice().reverse().forEach((c) => {
  const b = document.createElement("button");
  b.className = "swatch" + (c === penColor ? " sel" : "");
  b.style.background = c;
  b.addEventListener("click", () => {
    penColor = c;
    colorPick.value = c;
    erasing = false;
    eraserBtn.classList.remove("sel");
    drawTools.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("sel", s === b));
  });

// 되돌리기: 스트로크 시작마다 스냅샷 저장
const undoStack = [];
function snapshot() {
  if (undoStack.length >= 20) undoStack.shift();
  undoStack.push(dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
}
document.getElementById("undoBtn").addEventListener("click", () => {
  if (undoStack.length > 0) dctx.putImageData(undoStack.pop(), 0, 0);
});
document.getElementById("clearBtn").addEventListener("click", () => {
  snapshot();
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
});

let drawing = false;
let strokePts = [];
let strokeBase = null; // 스트로크 시작 시점 캔버스 (반투명 펜을 겹침 없이 다시 그리기 위함)
let strokeSeed = 0;

function canvasPoint(e) {
  const r = drawCanvas.getBoundingClientRect();
  return {
    x: ((e.clientX - r.left) / r.width) * drawCanvas.width,
    y: ((e.clientY - r.top) / r.height) * drawCanvas.height,
  };
}

function pxScale() {
  return drawCanvas.width / drawCanvas.getBoundingClientRect().width;
}

// 크레용 질감용 결정적 난수 (다시 그릴 때마다 모양이 안 바뀌게)
function hash(i) {
  const x = Math.sin(i * 127.1 + strokeSeed * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function strokePath(width, jitterK) {
  dctx.strokeStyle = penColor;
  dctx.lineWidth = width;
  dctx.lineCap = "round";
  dctx.lineJoin = "round";
  dctx.beginPath();
  strokePts.forEach((p, i) => {
    let x = p.x, y = p.y;
    if (jitterK !== undefined) {
      x += (hash(i * 3 + jitterK) - 0.5) * width * 0.9;
      y += (hash(i * 3 + jitterK + 1) - 0.5) * width * 0.9;
    }
    if (i === 0) dctx.moveTo(x, y);
    else dctx.lineTo(x, y);
  });
  if (strokePts.length === 1) dctx.lineTo(strokePts[0].x + 0.01, strokePts[0].y); // 점 하나도 보이게
  dctx.stroke();
}

// 반투명 펜은 시작 시점 이미지 위에 전체 경로를 매번 다시 그림 → 겹침 얼룩 없이 균일한 농도
function renderStroke() {
  const w = sizeRange.value * pxScale();
  dctx.putImageData(strokeBase, 0, 0);
  dctx.save();
  if (erasing) {
    dctx.globalCompositeOperation = "destination-out";
    strokePath(w * 2);
  } else if (brushType === "pen") {
    strokePath(w);
  } else if (brushType === "marker") {
    dctx.globalAlpha = 0.55;
    strokePath(w * 1.9);
  } else if (brushType === "highlight") {
    dctx.globalAlpha = 0.3;
    strokePath(w * 2.6);
  } else if (brushType === "crayon") {
    dctx.globalAlpha = 0.35;
    strokePath(w * 0.85, 0);
    strokePath(w * 0.7, 7);
    strokePath(w * 0.55, 13);
  }
  dctx.restore();
}

// 스프레이는 누적식: 지나갈 때마다 점을 뿌림
function sprayAt(pt) {
  const scale = pxScale();
  const r = sizeRange.value * scale * 1.6;
  dctx.save();
  if (erasing) dctx.globalCompositeOperation = "destination-out";
  dctx.fillStyle = penColor;
  dctx.globalAlpha = 0.85;
  const n = Math.max(12, Math.round(r));
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.sqrt(Math.random()) * r;
    dctx.beginPath();
    dctx.arc(pt.x + Math.cos(a) * d, pt.y + Math.sin(a) * d, 1.3 * scale, 0, Math.PI * 2);
    dctx.fill();
  }
  dctx.restore();
}

drawCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  drawCanvas.setPointerCapture(e.pointerId);
  snapshot();
  drawing = true;
  strokeSeed++;
  strokePts = [canvasPoint(e)];
  if (brushType === "spray") {
    sprayAt(strokePts[0]);
  } else {
    strokeBase = undoStack[undoStack.length - 1];
    renderStroke();
  }
});
drawCanvas.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const pt = canvasPoint(e);
  strokePts.push(pt);
  if (brushType === "spray") sprayAt(pt);
  else renderStroke();
});
["pointerup", "pointercancel"].forEach((ev) =>
  drawCanvas.addEventListener(ev, () => { drawing = false; strokePts = []; strokeBase = null; })
);

// 그린 부분만 남기고 투명 여백을 잘라냄 (안 하면 여백 때문에 캐릭터가 작게 보임)
function trimmedDrawing() {
  const { width: W, height: H } = drawCanvas;
  const data = dctx.getImageData(0, 0, W, H).data;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (data[(y * W + x) * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null; // 아무것도 안 그림
  const pad = 12;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
  const tmp = document.createElement("canvas");
  tmp.width = maxX - minX + 1;
  tmp.height = maxY - minY + 1;
  tmp.getContext("2d").drawImage(drawCanvas, -minX, -minY);
  return tmp.toDataURL("image/png"); // 투명 배경 그대로 저장
}

// ---- 부착 슬롯 (지터 제거용 lerp 스무딩 상태) ----
const SMOOTH_K = 0.35;
const lerp = (a, b, k) => a + (b - a) * k;

function makeSlots(n) {
  return Array.from({ length: n }, (_, i) => ({
    active: false, x: 0, y: 0, size: 0,
    fist: 0, // 0=편 손, 1=주먹 (부드럽게 전환)
    phase: i * 1.7, // 슬롯마다 phase를 다르게 줘서 움직임이 어긋나게
    // 손바닥용: 등장/퇴장 비행 상태
    state: "idle", t: 0, missed: 99, detected: false,
    tx: 0, ty: 0, tsize: 0, sx: 0, sy: 0, ex: 0, ey: 0,
    flying: false, wasV: false,
    // 정수리용: 미끄러짐 물리
    roll: 0, attachX: 0, attachV: 0, yOff: 0, fallV: 0,
    eggState: "on", respawnAt: 0,
  }));
}
const palms = makeSlots(MAX_HANDS);
const heads = makeSlots(MAX_HEADS);
let palmCycle = 0; // ✌️ 제스처로 손바닥 그림 순환
let vToastTimer = null;
let lastFrameMs = 0;

function updateSlot(slot, tx, ty, tsize) {
  if (slot.size === 0) {
    slot.x = tx; slot.y = ty; slot.size = tsize;
  } else {
    slot.x = lerp(slot.x, tx, SMOOTH_K);
    slot.y = lerp(slot.y, ty, SMOOTH_K);
    slot.size = lerp(slot.size, tsize, SMOOTH_K);
  }
  slot.active = true;
}

// ---- 손그림 애니메이션: 83ms 단위 양자화로 12fps처럼 뚝뚝 끊기게 ----
function quantizedTime() {
  return Math.floor(performance.now() / 83) * 83;
}

// ---- 기본 그림 1: 새 (손바닥용) ----
function drawBird(c, b) {
  const qt = quantizedTime() / 1000;
  const s = b.size;
  const h = s * 2.1;
  const w = s * 1.55;

  const bob = Math.sin(qt * 3.1 + b.phase) * s * 0.09;
  const tilt = Math.sin(qt * 1.7 + b.phase) * 0.07;
  const blinkCycle = (qt * 1000 + b.phase * 500) % 2700;
  const blink = blinkCycle < 130;
  const sq = b.fist || 0; // 주먹 쥐면 1: 쪼그라들며 찡그림

  c.save();
  c.translate(b.x, b.y + bob + s * 0.2 * sq);
  c.rotate(tilt * (1 - sq));
  // 쪼그라짐: 전체 축소 + 옆으로 퍼지는 찌부 효과
  const shrink = 1 - 0.22 * sq;
  c.scale(shrink * (1 + 0.22 * sq), shrink * (1 - 0.28 * sq));

  c.lineWidth = Math.max(2.5, s * 0.11);
  c.lineJoin = "round";
  c.lineCap = "round";
  c.strokeStyle = "#1a1712";
  c.fillStyle = "#fdf8e4";

  // 날아다닐 때: 파닥이는 날개 (몸통 뒤에 먼저 그림)
  if (b.flying) {
    const wa = Math.sin(qt * 26 + b.phase);
    for (const dir of [-1, 1]) {
      c.save();
      c.translate(dir * w * 0.42, -h * 0.06);
      c.rotate(dir * (-0.4 + wa * 0.55));
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(dir * w * 0.55, -h * 0.18, dir * w * 0.7, h * 0.02);
      c.quadraticCurveTo(dir * w * 0.38, h * 0.14, 0, h * 0.07);
      c.closePath();
      c.fillStyle = "#fdf8e4";
      c.fill();
      c.stroke();
      c.restore();
    }
  }

  // 물방울형 몸통
  c.beginPath();
  c.moveTo(0, -h * 0.52);
  c.bezierCurveTo( w * 0.62, -h * 0.42,  w * 0.60,  h * 0.10,  w * 0.34,  h * 0.30);
  c.bezierCurveTo( w * 0.18,  h * 0.42, -w * 0.18,  h * 0.42, -w * 0.34,  h * 0.30);
  c.bezierCurveTo(-w * 0.60,  h * 0.10, -w * 0.62, -h * 0.42,  0, -h * 0.52);
  c.closePath();
  c.fill();
  c.stroke();

  // 꼬리 깃
  c.beginPath();
  c.moveTo(-w * 0.30, h * 0.18);
  c.lineTo(-w * 0.55, h * 0.34);
  c.lineTo(-w * 0.24, h * 0.34);
  c.closePath();
  c.fill();
  c.stroke();

  // 주황 삼각 부리
  c.beginPath();
  c.moveTo(w * 0.02, -h * 0.20);
  c.lineTo(w * 0.34, -h * 0.13);
  c.lineTo(w * 0.02, -h * 0.06);
  c.closePath();
  c.fillStyle = "#f5921e";
  c.fill();
  c.stroke();

  // 눈 2개 (주먹이면 >< 찡그림, 아니면 깜빡임/뜬 눈)
  const eyeY = -h * 0.30;
  const eyeR = s * 0.16;
  if (sq > 0.5) {
    // 찡그린 눈 >< + 미간 주름
    for (const [ex, dir] of [[-w * 0.16, 1], [w * 0.14, -1]]) {
      c.beginPath();
      c.moveTo(ex - dir * eyeR, eyeY - eyeR * 0.8);
      c.lineTo(ex + dir * eyeR * 0.6, eyeY);
      c.lineTo(ex - dir * eyeR, eyeY + eyeR * 0.8);
      c.stroke();
    }
    c.beginPath();
    c.moveTo(-w * 0.04, eyeY - eyeR * 1.5);
    c.lineTo(w * 0.02, eyeY - eyeR * 0.9);
    c.stroke();
  } else {
    for (const ex of [-w * 0.16, w * 0.14]) {
      if (blink) {
        c.beginPath();
        c.moveTo(ex - eyeR, eyeY);
        c.lineTo(ex + eyeR, eyeY);
        c.stroke();
      } else {
        c.beginPath();
        c.ellipse(ex, eyeY, eyeR, eyeR * 1.1, 0, 0, Math.PI * 2);
        c.fillStyle = "#ffffff";
        c.fill();
        c.stroke();
        c.beginPath();
        c.arc(ex + eyeR * 0.2, eyeY, eyeR * 0.42, 0, Math.PI * 2);
        c.fillStyle = "#1a1712";
        c.fill();
      }
    }
  }

  // 발 (날 때는 접음)
  if (!b.flying) {
    c.beginPath();
    c.moveTo(-w * 0.12, h * 0.40);
    c.lineTo(-w * 0.12, h * 0.52);
    c.moveTo( w * 0.12, h * 0.40);
    c.lineTo( w * 0.12, h * 0.52);
    c.stroke();
  }

  c.restore();
}

// ---- 기본 그림 2: 계란 후라이 (정수리용) ----
// slot.x = 머리 중심, slot.y = 정수리(머리 박스 윗변)
// 계란 후라이 모양 (로컬 좌표, 원점 = 흰자 중심)
function drawFriedEggShape(c, s) {
  c.lineWidth = Math.max(2.5, s * 0.1);
  c.lineJoin = "round";
  c.lineCap = "round";
  c.strokeStyle = "#1a1712";

  // 울퉁불퉁한 흰자
  c.beginPath();
  c.moveTo(-1.15 * s, 0.05 * s);
  c.bezierCurveTo(-1.25 * s, -0.5 * s, -0.6 * s, -0.72 * s, -0.2 * s, -0.58 * s);
  c.bezierCurveTo(0.1 * s, -0.78 * s, 0.72 * s, -0.68 * s, 0.92 * s, -0.34 * s);
  c.bezierCurveTo(1.28 * s, -0.12 * s, 1.12 * s, 0.28 * s, 0.68 * s, 0.36 * s);
  c.bezierCurveTo(0.32 * s, 0.48 * s, -0.4 * s, 0.48 * s, -0.75 * s, 0.38 * s);
  c.bezierCurveTo(-1.05 * s, 0.3 * s, -1.08 * s, 0.22 * s, -1.15 * s, 0.05 * s);
  c.closePath();
  c.fillStyle = "#fffdf5";
  c.fill();
  c.stroke();

  // 노른자
  c.beginPath();
  c.arc(0.05 * s, -0.12 * s, 0.42 * s, 0, Math.PI * 2);
  c.fillStyle = "#f7b733";
  c.fill();
  c.stroke();

  // 노른자 하이라이트
  c.beginPath();
  c.arc(-0.08 * s, -0.24 * s, 0.09 * s, 0, Math.PI * 2);
  c.fillStyle = "#fffdf5";
  c.fill();
}

function drawFriedEgg(c, slot) {
  const qt = quantizedTime() / 1000;
  const s = slot.size;
  const tilt = Math.sin(qt * 1.3 + slot.phase) * 0.05;
  const bob = Math.sin(qt * 2.6 + slot.phase) * s * 0.04;

  c.save();
  // 흰자 아랫면이 정수리에 살짝 얹히게
  c.translate(slot.x, slot.y + s * 0.15 + bob);
  c.rotate(tilt + (slot.extraRot || 0));
  drawFriedEggShape(c, s);
  c.restore();
}

// ---- 계란 흘러내림: 계란이 얼굴을 타고 축 늘어지며 미끄러지고, 끈적한 자국이 남음 ----
function drawEggMelt(c, slot, t) {
  const s = slot.size;
  const fade = t > 0.85 ? 1 - (t - 0.85) / 0.15 : 1;
  const slide = Math.pow(t, 1.5) * s * 3.4; // 처음엔 천천히, 점점 빨리 흘러내림

  c.save();
  c.globalAlpha = fade;
  c.lineJoin = "round";
  c.lineCap = "round";

  // 지나간 자리에 남는 끈적한 자국 (흰자 2줄 + 노른자 1줄)
  if (slide > s * 0.3) {
    for (const [ox, wMul, color] of [
      [-0.42, 0.17, "#fffdf5"],
      [0.5, 0.13, "#fffdf5"],
      [0.06, 0.11, "#f7b733"],
    ]) {
      const x = slot.x + ox * s;
      c.beginPath();
      c.moveTo(x, slot.y + s * 0.1);
      c.lineTo(x, slot.y + s * 0.1 + slide);
      c.lineWidth = s * wMul + Math.max(2, s * 0.07);
      c.strokeStyle = "#1a1712";
      c.stroke();
      c.lineWidth = s * wMul;
      c.strokeStyle = color;
      c.stroke();
    }
  }

  // 계란 본체가 얼굴을 타고 미끄러지며 축 늘어짐
  c.translate(slot.x, slot.y + s * 0.15 + slide);
  c.rotate(slot.roll || 0);
  c.scale(1 - t * 0.15, 1 + t * 0.35);
  drawFriedEggShape(c, s);
  c.restore();
}

// ---- 종이 구김 효과: 격자를 삼각형으로 쪼개 흐트러뜨리고 면마다 명암 ----
const crumpleCanvas = document.createElement("canvas");
const crumpleCtx = crumpleCanvas.getContext("2d");
const chash = (n) => {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
};

// 삼각형 단위 아핀 매핑으로 이미지 조각을 왜곡해서 그림
function drawWarpTriangle(c, img, s0, s1, s2, d0, d1, d2) {
  const denom = s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
  if (!denom) return;
  c.save();
  c.beginPath();
  c.moveTo(d0.x, d0.y); c.lineTo(d1.x, d1.y); c.lineTo(d2.x, d2.y);
  c.closePath();
  c.clip();
  const a = (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) / denom;
  const b = (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) / denom;
  const cc = (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) / denom;
  const dd = (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) / denom;
  const e = (d0.x * (s1.x * s2.y - s2.x * s1.y) + d1.x * (s2.x * s0.y - s0.x * s2.y) + d2.x * (s0.x * s1.y - s1.x * s0.y)) / denom;
  const f = (d0.y * (s1.x * s2.y - s2.x * s1.y) + d1.y * (s2.x * s0.y - s0.x * s2.y) + d2.y * (s0.x * s1.y - s1.x * s0.y)) / denom;
  c.transform(a, b, cc, dd, e, f);
  c.drawImage(img, 0, 0);
  c.restore();
}

function drawCrumpledImage(c, img, x, y, w, h, sq, seed) {
  const GN = 4; // 4x4 격자
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const cx0 = x + w / 2, cy0 = y + h / 2;
  const verts = [];
  for (let gy = 0; gy <= GN; gy++) {
    for (let gx = 0; gx <= GN; gx++) {
      const n = seed + gy * 47 + gx * 13;
      const px = x + (gx / GN) * w;
      const py = y + (gy / GN) * h;
      verts.push({
        sx: (gx / GN) * iw,
        sy: (gy / GN) * ih,
        // 중심으로 살짝 뭉치면서 + 꼭짓점마다 제멋대로 흔들림
        x: cx0 + (px - cx0) * (1 - 0.15 * sq) + (chash(n) - 0.5) * (w / GN) * 0.9 * sq,
        y: cy0 + (py - cy0) * (1 - 0.15 * sq) + (chash(n + 0.5) - 0.5) * (h / GN) * 0.9 * sq,
      });
    }
  }
  const V = (gx, gy) => verts[gy * (GN + 1) + gx];
  let ti = 0;
  for (let gy = 0; gy < GN; gy++) {
    for (let gx = 0; gx < GN; gx++) {
      for (const [v0, v1, v2] of [
        [V(gx, gy), V(gx + 1, gy), V(gx, gy + 1)],
        [V(gx + 1, gy), V(gx + 1, gy + 1), V(gx, gy + 1)],
      ]) {
        drawWarpTriangle(c, img,
          { x: v0.sx, y: v0.sy }, { x: v1.sx, y: v1.sy }, { x: v2.sx, y: v2.sy },
          v0, v1, v2);
        // 접힌 면마다 밝고 어두운 명암을 줘서 종이 구김 느낌
        const shade = (chash(seed + ti * 7.3) - 0.5) * 0.5 * sq;
        c.save();
        c.globalCompositeOperation = "source-atop"; // 이미지 픽셀 위에만 칠해짐
        c.fillStyle = shade > 0 ? `rgba(255,255,255,${shade})` : `rgba(26,23,18,${-shade})`;
        c.beginPath();
        c.moveTo(v0.x, v0.y); c.lineTo(v1.x, v1.y); c.lineTo(v2.x, v2.y);
        c.closePath();
        c.fill();
        c.restore();
        ti++;
      }
    }
  }
}

// ---- 등록된 손그림 이미지 드로잉 ----
function drawCustomImage(pair, slot, part) {
  const img = pair.img;
  const qt = quantizedTime() / 1000;
  const bob = Math.sin(qt * 3.1 + slot.phase) * slot.size * 0.09;
  const tilt = Math.sin(qt * 1.7 + slot.phase) * 0.07;
  const h = slot.size * (part === "palm" ? 2.1 : 1.7);
  const w = h * (img.naturalWidth / img.naturalHeight);
  const dx = -w / 2;
  const dy = part === "palm" ? -h / 2 : -h + slot.size * 0.25; // 정수리는 아랫변이 얹히게
  const sq = slot.fist || 0; // 주먹 쥐면 커스텀 그림도 찌부

  ctx.save();
  ctx.translate(slot.x, slot.y + bob + slot.size * 0.2 * sq);
  // 날아다닐 때는 좀 더 크게 흔들리고, 정수리 미끄러짐 회전도 반영
  const flyWobble = slot.flying ? Math.sin(qt * 20 + slot.phase) * 0.15 : 0;
  ctx.rotate(tilt * (1 - sq) + (slot.extraRot || 0) + flyWobble);
  const shrink = 1 - 0.22 * sq;
  ctx.scale(shrink * (1 + 0.22 * sq), shrink * (1 - 0.28 * sq));
  if (sq > 0.04) {
    // 주먹 쥐는 정도만큼 종이처럼 구겨짐. 시드에 시간을 섞어 구김이 꿈틀거림
    const pad = Math.ceil(Math.max(w, h) * 0.2);
    const W = Math.ceil(w) + pad * 2, H = Math.ceil(h) + pad * 2;
    if (crumpleCanvas.width < W) crumpleCanvas.width = W;
    if (crumpleCanvas.height < H) crumpleCanvas.height = H;
    crumpleCtx.clearRect(0, 0, crumpleCanvas.width, crumpleCanvas.height);
    const seed = slot.phase * 37.7 + Math.floor(performance.now() / 250) * 0.618;
    drawCrumpledImage(crumpleCtx, img, pad, pad, w, h, sq, seed);
    ctx.drawImage(crumpleCanvas, 0, 0, W, H, dx - pad, dy - pad, W, H);
  } else {
    ctx.drawImage(img, dx, dy, w, h);
  }
  const blinkCycle = (qt * 1000 + slot.phase * 500) % 2700;
  if (blinkCycle < 130 && sq < 0.5) drawEyesBlink(ctx, pair, dx, dy, w, h);
  ctx.restore();
}

// ---- 시작 화면 기본 그림 미리보기 (같은 드로잉 함수 재사용, 애니메이션 포함) ----
const defBirdCtx = document.getElementById("defBird").getContext("2d");
const defEggCtx = document.getElementById("defEgg").getContext("2d");
function drawPairThumb(pair, i) {
  const c = pair.thumbCtx;
  const img = pair.img;
  if (!c || !img.complete || !img.naturalWidth) return;
  const S = 104;
  const qt = quantizedTime() / 1000;
  const phase = i * 1.7;
  const bob = Math.sin(qt * 3.1 + phase) * S * 0.03;
  const tilt = Math.sin(qt * 1.7 + phase) * 0.07;
  const maxDim = S * 0.72;
  const ar = img.naturalWidth / img.naturalHeight;
  const w = ar >= 1 ? maxDim : maxDim * ar;
  const h = ar >= 1 ? maxDim / ar : maxDim;
  c.clearRect(0, 0, S, S);
  c.save();
  c.translate(S / 2, S / 2 + bob);
  c.rotate(tilt);
  c.drawImage(img, -w / 2, -h / 2, w, h);
  const blinkCycle = (qt * 1000 + phase * 500) % 2700;
  if (blinkCycle < 130) drawEyesBlink(c, pair, -w / 2, -h / 2, w, h);
  c.restore();
}

// 파비콘도 기본 새 그림으로 (눈 감은 순간이면 잠깐 뒤에 다시 그림)

// ---- MediaPipe + 카메라 초기화 ----
let handLandmarker = null;
let faceDetector = null;
let lastVideoTime = -1;
let running = false;

// 카메라 열기. iOS는 카메라 모드를 가로 기준(1280x720)으로 고른 뒤 기기 방향에 맞춰
// 알아서 회전해주므로, 세로 비율을 강제로 요청하면 오히려 가로 영상이 온다.
// 표준 모드를 요청하고, 세로 화면인데 가로 영상이 오면 브라우저 기본 설정으로 재시도.
async function openCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
  const portrait = window.innerHeight >= window.innerWidth;
  const tries = [
    { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    { facingMode: "user" },
  ];
  let stream = null;
  for (let i = 0; i < tries.length; i++) {
    stream = await navigator.mediaDevices.getUserMedia({ video: tries[i], audio: false });
    const st = stream.getVideoTracks()[0].getSettings();
    const streamPortrait = (st.height || 0) >= (st.width || 1);
    if (!portrait || streamPortrait || i === tries.length - 1) break;
    stream.getTracks().forEach((t) => t.stop());
  }
  video.srcObject = stream;
  await new Promise((res) => (video.onloadedmetadata = res));
  await video.play();
  updateCrop();
}

// 기기 회전/창 크기 변경 시 크롭만 다시 계산.
// iOS는 회전하면 기존 스트림을 알아서 돌려주므로 카메라를 다시 열면 안 됨 (멈춤 원인)
window.addEventListener("resize", () => {
  if (running) updateCrop();
});

// 일부 안드로이드 GPU에서 GPU 모드가 에러 없이 빈 결과만 내는 문제가 있어
// CPU 폴백을 지원 (로딩 실패 시 즉시, 인식 0건이 지속되면 자동 전환)
let delegateTried = false; // CPU 전환을 이미 시도했는지
let detectionSeen = false;
let detectStartMs = 0;

async function createDetectors(delegate) {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO",
    numHands: MAX_HANDS,
  });
  faceDetector = await FaceDetector.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate,
    },
    runningMode: "VIDEO",
  });
}

// CPU 전환 후에도 계속 인식이 안 되면 진단 정보를 화면에 고정 표시 (스크린샷용)
let diagShown = false;
let lastDetectError = null;

function showDiagnosticsIfStuck(err) {
  if (diagShown || !delegateTried || detectionSeen) return;
  if (performance.now() - detectStartMs < 8000) return;
  diagShown = true;
  const browser = (navigator.userAgent.match(/(Chrome|SamsungBrowser|Firefox)\/[\d.]+/) || ["?"])[0];
  setStatus(
    `인식이 계속 안 돼요 · ${err ? "오류: " + err : "결과 없음"} · CPU 모드 · ${browser} · 이 메시지를 캡처해서 알려주세요`
  );
}

// 카메라는 나오는데 몇 초째 손도 얼굴도 인식 못 하면 CPU 모드로 전환
function maybeFallbackToCpu() {
  if (detectionSeen || delegateTried || performance.now() - detectStartMs < 5000) return;
  delegateTried = true;
  setStatus("인식이 안 돼서 호환 모드로 전환 중...");
  (async () => {
    const oldHand = handLandmarker, oldFace = faceDetector;
    handLandmarker = null; // 전환 중에는 감지 건너뜀
    faceDetector = null;
    try {
      await createDetectors("CPU");
      detectStartMs = performance.now();
      setStatus("호환 모드로 전환됐어요", false);
      setTimeout(() => statusEl.classList.add("hidden"), 1800);
    } catch (e) {
      setStatus("인식 엔진 전환 실패: " + e.message);
    }
    try { oldHand?.close(); oldFace?.close(); } catch (e) {}
  })();
}

async function init() {
  try {
    if (!handLandmarker) {
      setStatus("모델 로딩 중...");
      try {
        await createDetectors("GPU");
      } catch (e) {
        delegateTried = true;
        await createDetectors("CPU"); // GPU 로딩 자체가 실패하는 기기
      }
    }
  } catch (e) {
    setStatus("모델 로딩 실패: " + e.message);
    return;
  }

  try {
    setStatus("카메라 켜는 중...");
    await openCamera();
  } catch (e) {
    setStatus("카메라 권한이 필요합니다: " + e.message);
    return;
  }

  // 좌표 계산은 항상 캔버스 픽셀 기준 (CSS 크기와 다름)
  updateCrop();

  setStatus("손바닥이나 얼굴을 카메라에 보여주세요 ✋", false);
  setTimeout(() => statusEl.classList.add("hidden"), 2500);

  lastVideoTime = -1;
  lastFrameMs = performance.now();
  detectStartMs = performance.now();
  detectionSeen = false;
  palms.forEach((s) => {
    s.active = false; s.size = 0; s.state = "idle"; s.missed = 99;
    s.detected = false; s.fist = 0; s.wasV = false; s.flying = false;
  });
  heads.forEach((s) => {
    s.active = false; s.size = 0; s.roll = 0; s.kp = null;
    s.attachX = 0; s.attachV = 0; s.yOff = 0; s.fallV = 0;
    s.eggState = "on"; s.eggBornAt = 0; s.meltT = 0;
  });
  running = true;
  requestAnimationFrame(loop);
}

// 화면(스테이지) 비율에 맞는 크롭 영역. 폰/아이패드 세로 화면이면 가로 영상의 가운데를 세로로 잘라 씀
let crop = { x: 0, y: 0, w: 1, h: 1 };
function updateCrop() {
  const stage = document.getElementById("stage");
  const A = stage.clientWidth / stage.clientHeight;
  const VW = video.videoWidth, VH = video.videoHeight;
  if (!VW || !VH) return;
  // 화면 비율까지 자르되, 원본의 30% 이상은 잘라내지 않음 (과도한 확대 방지)
  // 못 채운 만큼은 object-fit: contain이 위아래/양옆 여백으로 처리
  const MIN_KEEP = 0.7;
  let cw, ch;
  if (VW / VH > A) {
    ch = VH;
    cw = Math.min(VW, Math.max(Math.round(VH * A), Math.round(VW * MIN_KEEP)));
  } else {
    cw = VW;
    ch = Math.min(VH, Math.max(Math.round(VW / A), Math.round(VH * MIN_KEEP)));
  }
  crop = { x: Math.round((VW - cw) / 2), y: Math.round((VH - ch) / 2), w: cw, h: ch };
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
}

let lastVW = 0, lastVH = 0;

function loop() {
  if (!running) return;
  // 회전 시 iOS가 스트림 해상도를 스왑해주므로, 바뀐 걸 감지하면 크롭 재계산
  if (video.videoWidth !== lastVW || video.videoHeight !== lastVH) {
    lastVW = video.videoWidth;
    lastVH = video.videoHeight;
    updateCrop();
  }
  // 비디오의 크롭 영역을 셀피 모드로 좌우반전해서 그림
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, crop.x, crop.y, crop.w, crop.h, -crop.w, 0, crop.w, crop.h);
  ctx.restore();

  // detectForVideo는 currentTime 변경 시에만 호출 (중복 추론 방지)
  if (handLandmarker && faceDetector && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    try {

    // 랜드마크는 원본 프레임 기준이므로 크롭 오프셋을 빼고 미러링 보정
    const VW = video.videoWidth, VH = video.videoHeight;
    const mapX = (nx) => crop.w - (nx * VW - crop.x);
    const mapY = (ny) => ny * VH - crop.y;

    // 손 → 손바닥 슬롯 (등장/퇴장 비행은 아래 상태 머신에서 처리)
    const handResult = handLandmarker.detectForVideo(video, now);
    palms.forEach((s) => (s.detected = false));
    const hands = handResult.landmarks || [];
    for (let i = 0; i < Math.min(hands.length, palms.length); i++) {
      const lm = hands[i];
      const s = palms[i];
      const wrist = { x: mapX(lm[0].x), y: mapY(lm[0].y) };
      const midRoot = { x: mapX(lm[9].x), y: mapY(lm[9].y) };
      const dist = Math.hypot(midRoot.x - wrist.x, midRoot.y - wrist.y);
      s.detected = true;
      s.tx = (wrist.x + midRoot.x) / 2;
      s.ty = (wrist.y + midRoot.y) / 2;
      s.tsize = dist * 0.5;

      // 손가락 굽힘: 손끝이 중간 관절보다 손목에 가까우면 접힌 것
      const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
      const folded = [[8, 6], [12, 10], [16, 14], [20, 18]].map(
        ([tip, pip]) => d3(lm[tip], lm[0]) < d3(lm[pip], lm[0])
      );
      const curled = folded.filter(Boolean).length;
      const prevFist = s.fist;
      s.fist = lerp(s.fist, curled >= 3 ? 1 : 0, SMOOTH_K);
      if (prevFist < 0.55 && s.fist >= 0.55) sfxCrunch(); // 구기는 소리

      // ✌️ V 제스처: 검지·중지만 펴면 다음 그림으로 전환
      const isV = !folded[0] && !folded[1] && folded[2] && folded[3];
      if (isV && !s.wasV) {
        const n = pairsFor("palm").length;
        if (n > 1) {
          palmCycle++;
          setStatus(`✌️ 그림 변경 (${(palmCycle % n) + 1}/${n})`);
          clearTimeout(vToastTimer);
          vToastTimer = setTimeout(() => statusEl.classList.add("hidden"), 900);
        }
      }
      s.wasV = isV;
    }

    // 얼굴 → 정수리 슬롯 (박스 좌표는 픽셀 단위)
    const faceResult = faceDetector.detectForVideo(video, now);
    heads.forEach((s) => (s.active = false));
    const rawFaces = faceResult.detections || [];
    // 한 얼굴에 박스가 두 개 잡히는 중복 검출 제거
    const faces = [];
    for (const det of rawFaces) {
      const b = det.boundingBox;
      const bcx = b.originX + b.width / 2, bcy = b.originY + b.height / 2;
      const dup = faces.some((o) => {
        const ob = o.boundingBox;
        return Math.hypot(ob.originX + ob.width / 2 - bcx, ob.originY + ob.height / 2 - bcy) <
          Math.max(b.width, ob.width) * 0.6;
      });
      if (!dup) faces.push(det);
      if (faces.length >= MAX_HEADS) break;
    }
    for (const det of faces) {
      const box = det.boundingBox;
      const cx = crop.w - (box.originX - crop.x + box.width / 2);
      // 박스 윗변은 이마 근처라서 실제 정수리(머리카락 위)만큼 위로 올림
      const topY = box.originY - crop.y - box.height * 0.25;
      // 이전 프레임 위치가 가장 가까운 슬롯을 재사용 → 계란 상태가 같은 얼굴을 따라감
      let s = null, bestD = Infinity;
      for (const cand of heads) {
        if (cand.active || cand.size === 0) continue;
        const d = Math.hypot(cand.x - cx, cand.y - topY);
        if (d < bestD) { bestD = d; s = cand; }
      }
      if (!s || bestD > box.width * 1.5) {
        s = heads.find((c2) => !c2.active && c2.size === 0) || heads.find((c2) => !c2.active);
        if (!s) continue;
        // 새 얼굴이면 계란도 처음부터
        s.size = 0; s.kp = null; s.roll = 0;
        s.eggState = "on"; s.eggBornAt = 0; s.meltT = 0;
        s.attachX = 0; s.attachV = 0; s.yOff = 0; s.fallV = 0;
      }
      updateSlot(s, cx, topY, box.width * 0.32);
      // 고개 기울기(roll)와 얼굴 부위 키포인트 (0:오른눈 1:왼눈 2:코 3:입 4:오른귀 5:왼귀)
      const kp = det.keypoints;
      if (kp && kp.length >= 6) {
        const P = (k) => ({ x: mapX(k.x), y: mapY(k.y) });
        const eyeR = P(kp[0]), eyeL = P(kp[1]), nose = P(kp[2]);
        const mouth = P(kp[3]), earR = P(kp[4]), earL = P(kp[5]);
        let ang = Math.atan2(eyeL.y - eyeR.y, eyeL.x - eyeR.x);
        if (ang > Math.PI / 2) ang -= Math.PI;
        if (ang < -Math.PI / 2) ang += Math.PI;
        s.roll = lerp(s.roll, ang, 0.3);
        // 볼: 코와 귀 사이, 눈과 입 사이 높이로 추정
        const targetKp = {
          eye: [eyeR, eyeL],
          nose: [nose],
          mouth: [mouth],
          ear: [earR, earL],
          cheek: [
            { x: (earR.x + nose.x) / 2, y: (eyeR.y + mouth.y) / 2 },
            { x: (earL.x + nose.x) / 2, y: (eyeL.y + mouth.y) / 2 },
          ],
        };
        if (!s.kp) {
          s.kp = targetKp;
        } else {
          for (const key in targetKp) {
            targetKp[key].forEach((p, j) => {
              s.kp[key][j].x = lerp(s.kp[key][j].x, p.x, SMOOTH_K);
              s.kp[key][j].y = lerp(s.kp[key][j].y, p.y, SMOOTH_K);
            });
          }
        }
      }
    }

    if (hands.length > 0 || faces.length > 0) {
      detectionSeen = true;
      if (diagShown) { diagShown = false; statusEl.classList.add("hidden"); }
    } else {
      maybeFallbackToCpu();
      showDiagnosticsIfStuck(null);
    }
    } catch (e) {
      // 인식 호출 자체가 죽는 기기: 루프는 유지하고 오류를 화면에 표시
      lastDetectError = e.message || String(e);
      maybeFallbackToCpu();
      showDiagnosticsIfStuck(lastDetectError);
    }
  }

  // ---- 손바닥 새: 등장/퇴장 비행 상태 머신 ----
  const nowMs = performance.now();
  const dt = Math.min(0.05, (nowMs - lastFrameMs) / 1000);
  lastFrameMs = nowMs;
  const bez = (t, a, c, b) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;

  const palmPairs = pairsFor("palm");
  for (const s of palms) {
    s.missed = s.detected ? 0 : s.missed + 1;
    const present = s.detected || s.missed < 8; // 인식이 잠깐 끊겨도 유지

    if (s.state === "idle") {
      if (s.detected) {
        // 가까운 쪽 화면 밖에서 날아오기 시작
        s.state = "arriving"; s.t = 0;
        s.sx = s.tx < canvas.width / 2 ? -canvas.width * 0.15 : canvas.width * 1.15;
        s.sy = s.ty * 0.5;
        s.x = s.sx; s.y = s.sy; s.size = s.tsize;
      }
    } else if (s.state === "arriving") {
      s.t += dt / 0.7;
      const t = Math.min(1, s.t);
      const cxp = (s.sx + s.tx) / 2;
      const cyp = Math.min(s.sy, s.ty) - canvas.height * 0.15;
      s.x = bez(t, s.sx, cxp, s.tx);
      s.y = bez(t, s.sy, cyp, s.ty);
      s.size = lerp(s.size, s.tsize, 0.3);
      if (t >= 1) { s.state = "landed"; sfxChirp(); }
      else if (!present) { s.state = "leaving"; s.t = 0; s.sx = s.x; s.sy = s.y; s.ex = s.x < canvas.width / 2 ? -canvas.width * 0.2 : canvas.width * 1.2; s.ey = -canvas.height * 0.2; }
    } else if (s.state === "landed") {
      if (present) {
        if (s.detected) {
          s.x = lerp(s.x, s.tx, SMOOTH_K);
          s.y = lerp(s.y, s.ty, SMOOTH_K);
          s.size = lerp(s.size, s.tsize, SMOOTH_K);
        }
      } else {
        // 손이 사라지면 위로 날아감
        s.state = "leaving"; s.t = 0; s.sx = s.x; s.sy = s.y;
        s.ex = s.x < canvas.width / 2 ? -canvas.width * 0.2 : canvas.width * 1.2;
        s.ey = -canvas.height * 0.2;
        s.fist = 0;
      }
    } else if (s.state === "leaving") {
      s.t += dt / 0.8;
      const t = Math.min(1, s.t);
      const cxp = (s.sx + s.ex) / 2;
      const cyp = Math.min(s.sy, s.ey) - canvas.height * 0.1;
      s.x = bez(t, s.sx, cxp, s.ex);
      s.y = bez(t, s.sy, cyp, s.ey);
      if (s.detected) { s.state = "arriving"; s.t = 0; s.sx = s.x; s.sy = s.y; } // 다시 나타나면 되돌아옴
      else if (t >= 1) s.state = "idle";
    }
    s.flying = s.state === "arriving" || s.state === "leaving";

    if (s.state === "idle") continue;
    const i = palms.indexOf(s);
    if (palmPairs.length > 0) drawCustomImage(palmPairs[(i + palmCycle) % palmPairs.length], s, "palm");
    else drawBird(ctx, s);
  }

  // ---- 정수리: 고개 기울이면 미끄러지다 떨어지고, 잠시 뒤 위에서 새로 떨어짐 ----
  const headPairs = pairsFor("head");
  for (const s of heads) {
    if (!s.active) continue;
    const f = Math.min(3, dt * 60); // 프레임 정규화 계수
    if (s.eggState === "gone") {
      if (nowMs > s.respawnAt) {
        s.eggState = "dropping";
        s.attachX = 0; s.attachV = 0; s.fallV = 0;
        s.yOff = -(s.y + s.size * 3); // 화면 위에서 떨어짐
      } else continue;
    }
    if (s.eggState === "dropping") {
      s.fallV += s.size * 0.045 * f;
      s.yOff += s.fallV * f;
      if (s.yOff >= 0) { s.yOff = 0; s.fallV = 0; s.eggState = "on"; s.eggBornAt = nowMs; }
    } else if (s.eggState === "on") {
      if (!s.eggBornAt) s.eggBornAt = nowMs;
      // 3초 지나면 흘러내림 (기본 계란일 때만) — 그 전에 고개를 흔들어 옆 사람에게 넘길 것!
      if (headPairs.length === 0 && nowMs - s.eggBornAt > 3000) {
        s.eggState = "melting";
        s.meltT = 0;
      } else {
        s.attachV += Math.sin(s.roll) * s.size * 0.025 * f;
        s.attachV *= Math.pow(0.93, f);
        s.attachX += s.attachV * f;
        if (Math.abs(s.attachX) > s.size * 1.9) {
          s.eggState = "falling";
          s.fallV = 0;
          s.attachV *= 1.6; // 던지는 느낌으로 가속
        }
      }
    } else if (s.eggState === "melting") {
      s.meltT += dt / 5; // 5초에 걸쳐 천천히 흘러내림
      drawEggMelt(ctx, s, Math.min(1, s.meltT));
      if (s.meltT >= 1) { s.eggState = "gone"; s.respawnAt = nowMs + 2000; s.eggBornAt = 0; }
      continue; // 흘러내리는 동안은 일반 계란 드로잉 생략
    } else if (s.eggState === "falling") {
      s.fallV += s.size * 0.05 * f;
      s.yOff += s.fallV * f;
      s.attachX += s.attachV * f;
      // 날아가다 다른 사람 정수리에 착지하면 그 사람 계란이 됨
      const ex = s.x + Math.cos(s.roll) * s.attachX;
      const ey = s.y + Math.sin(s.roll) * s.attachX + s.yOff;
      let caught = false;
      for (const o of heads) {
        if (o === s || !o.active) continue;
        if (s.fallV > 0 && Math.abs(ex - o.x) < o.size * 1.8 && Math.abs(ey - o.y) < o.size * 1.5) {
          o.eggState = "on";
          o.eggBornAt = nowMs; // 새로 3초 카운트
          o.attachX = Math.max(-o.size, Math.min(o.size, ex - o.x));
          o.attachV = s.attachV * 0.4;
          o.yOff = 0; o.fallV = 0;
          s.eggState = "gone"; s.respawnAt = nowMs + 2500; s.yOff = 0; s.eggBornAt = 0;
          sfxChirp();
          caught = true;
          break;
        }
      }
      if (caught) continue;
      if (s.y + s.yOff > canvas.height + s.size * 3) {
        s.eggState = "gone";
        s.respawnAt = nowMs + 1800;
        s.yOff = 0;
        s.eggBornAt = 0;
        continue;
      }
    }
    const i = heads.indexOf(s);
    const ds = Object.assign({}, s, {
      x: s.x + Math.cos(s.roll) * s.attachX,
      y: s.y + Math.sin(s.roll) * s.attachX + s.yOff,
      extraRot: s.roll + s.attachX / (s.size * 4),
    });
    if (headPairs.length > 0) drawCustomImage(headPairs[i % headPairs.length], ds, "head");
    else drawFriedEgg(ctx, ds);
  }

  // ---- 얼굴 부위(눈/코/입/볼/귀)에 등록한 그림 부착 ----
  for (const s of heads) {
    if (!s.active || !s.kp) continue;
    for (const part in FACE_PART_SIZE) {
      const pp = pairsFor(part);
      if (pp.length === 0) continue;
      s.kp[part].forEach((pt, j) => drawFacePart(pp[j % pp.length], pt, s, FACE_PART_SIZE[part], j));
    }
  }

  requestAnimationFrame(loop);
}

// 얼굴 부위별 그림 크기 (얼굴 크기 대비 배율)
const FACE_PART_SIZE = { eye: 0.85, nose: 0.95, mouth: 1.05, cheek: 0.85, ear: 0.95 };

function drawFacePart(pair, pt, slot, mult, idx) {
  const img = pair.img;
  if (!img.complete || !img.naturalWidth) return;
  const qt = quantizedTime() / 1000;
  const phase = slot.phase + idx * 2.3;
  const bob = Math.sin(qt * 3.1 + phase) * slot.size * 0.04;
  const tilt = Math.sin(qt * 1.7 + phase) * 0.05;
  const h = slot.size * mult;
  const w = h * (img.naturalWidth / img.naturalHeight);
  ctx.save();
  ctx.translate(pt.x, pt.y + bob);
  ctx.rotate((slot.roll || 0) + tilt);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  const blinkCycle = (qt * 1000 + phase * 500) % 2700;
  if (blinkCycle < 130) drawEyesBlink(ctx, pair, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// ---- 효과음: WebAudio로 합성 (파일 없음). 녹화에도 섞여 들어감 ----
let audioCtx = null, sfxGain = null, recDest = null, micConnected = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.5;
    sfxGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// 착지할 때 "짹짹"
function sfxChirp() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (const [dt, f0, f1] of [[0, 2300, 3300], [0.13, 2700, 3500]]) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t0 + dt);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dt + 0.07);
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.1);
    o.connect(g);
    g.connect(sfxGain);
    o.start(t0 + dt);
    o.stop(t0 + dt + 0.12);
  }
}

// 주먹 쥘 때 종이 구기는 "빠삭"
function sfxCrunch() {
  if (!audioCtx) return;
  const dur = 0.2;
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const env = 1 - i / d.length;
    d[i] = (Math.random() * 2 - 1) * env * (Math.random() < 0.15 ? 1 : 0.35);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = 3200;
  f.Q.value = 0.6;
  const g = audioCtx.createGain();
  g.gain.value = 0.6;
  src.connect(f); f.connect(g); g.connect(sfxGain);
  src.start();
}

// ---- 뒤로 가기: 카메라 끄고 시작 화면으로 ----
document.getElementById("backBtn").addEventListener("click", () => {
  if (recorder && recorder.state === "recording") recorder.stop();
  running = false;
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
  }
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
    micConnected = false;
  }
  document.getElementById("controls").style.display = "none";
  statusEl.classList.add("hidden");
  setupEl.style.display = "flex";
});

// ---- 📸 사진: 현재 프레임을 찍어서 공유 시트(가능하면) 또는 다운로드 ----
document.getElementById("photoBtn").addEventListener("click", () => {
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], `hand-bird-${Date.now()}.png`, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; // 사용자가 공유 취소
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, "image/png");
});

// ---- 녹화: canvas.captureStream(30) + 마이크 + MediaRecorder ----
let recorder = null;
let chunks = [];
let micStream = null;

async function getMic() {
  if (micStream) return micStream;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus("마이크 권한이 없어 무음으로 녹화됩니다");
    setTimeout(() => statusEl.classList.add("hidden"), 2500);
  }
  return micStream;
}

function pickMimeType() {
  // 아이폰/아이패드 사진 앱에서 바로 재생되도록 mp4 우선
  const candidates = [
    "video/mp4;codecs=avc1",
    "video/mp4",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
  ];
  return candidates.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

recordBtn.addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
    return;
  }
  const mimeType = pickMimeType();
  const stream = canvas.captureStream(30);
  // 마이크와 효과음을 오디오 그래프에서 한 트랙으로 섞어 녹화에 넣음
  initAudio();
  const mic = await getMic();
  if (!recDest) {
    recDest = audioCtx.createMediaStreamDestination();
    sfxGain.connect(recDest);
  }
  if (mic && !micConnected) {
    audioCtx.createMediaStreamSource(mic).connect(recDest);
    micConnected = true;
  }
  stream.addTrack(recDest.stream.getAudioTracks()[0]);
  try {
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  } catch (e) {
    setStatus("이 브라우저는 녹화를 지원하지 않습니다: " + e.message);
    return;
  }
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mimeType || "video/webm";
    const ext = type.includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hand-bird-${Date.now()}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    recordBtn.textContent = "● 녹화";
    recordBtn.classList.remove("recording");
  };
  recorder.start();
  recordBtn.textContent = "■ 정지";
  recordBtn.classList.add("recording");
});
</script>
